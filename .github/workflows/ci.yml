name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Lifecycle tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Syntax-check the view module
        run: for f in mods/*/main.js; do node --check "$f" || exit 1; done

  python:
    name: Installer tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py'

  files:
    name: Mod files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JSON files parse
        run: |
          for f in mods/*/mod.json keys.json package.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
      - name: Installer copies every file the mod ships
        run: |
          python3 - <<'EOF'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location("installer", "scripts/install.py")
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          for name, files in installer.MOD_FILES.items():
              shipped = {p.name for p in (pathlib.Path("mods") / name).iterdir()} - installer.GENERATED
              listed = set(files)
              if shipped != listed:
                  print(f"::error file=scripts/install.py::MOD_FILES differs from mods/{name}: "
                        f"missing {sorted(shipped - listed)}, extra {sorted(listed - shipped)}")
                  sys.exit(1)
          EOF
      - name: Listing assets exist
        run: test -f RECIPE.md && test -f preview.png
